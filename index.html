<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RACCOON VISION </title>
<style>
:root{color-scheme:dark;--pink:#fc40dc;--violet:#7335f4;--cyan:#56eaff;--yellow:#ffd53f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#2c1756 0%,#080b24 55%,#030713 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white}.app{position:relative;isolation:isolate;width:min(100%,430px);min-height:100dvh;overflow:hidden;padding:18px 17px 26px;border:2px solid #6343b8;background:linear-gradient(180deg,#0c1338 0%,#12133e 58%,#110e36 100%);box-shadow:0 0 38px #903cfc52}.app:before{content:"";position:absolute;z-index:-1;inset:12% 0 0;background:radial-gradient(circle at 50% 31%,#ff2cc054,transparent 37%),repeating-linear-gradient(90deg,transparent 0 39px,#aa38fc36 40px 41px),repeating-linear-gradient(0deg,transparent 0 39px,#aa38fc30 40px 41px);transform:perspective(420px) rotateX(28deg) scale(1.65);transform-origin:center bottom;mask-image:linear-gradient(transparent,#000 42%);opacity:.66}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 22%,white 98%,transparent),radial-gradient(3px 3px at 81% 29%,#aeedff 98%,transparent),radial-gradient(2px 2px at 32% 15%,white 98%,transparent),radial-gradient(2px 2px at 67% 8%,white 98%,transparent),radial-gradient(2px 2px at 91% 49%,white 98%,transparent)}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:1000;letter-spacing:2px;text-shadow:0 0 13px var(--pink);font-size:20px}.badge{padding:6px 9px;border:1px solid #76efff;border-radius:8px;font-size:11px;color:#a6f6ff}.settings{display:flex;gap:8px;margin-top:19px}.settings label{display:flex;flex:1;align-items:center;gap:4px;background:#11172f;border:2px solid #7477c0;border-radius:13px;padding:9px 7px;font-weight:800;font-size:13px;box-shadow:0 0 9px #933fff59}select{width:100%;background:transparent;border:0;outline:0;color:#fff;font-weight:800;min-width:0}option{color:#111}.sun{position:absolute;z-index:-1;top:150px;left:50%;transform:translateX(-50%);width:230px;height:230px;border-radius:50%;background:repeating-linear-gradient(to bottom,#ff73df 0 12px,#b826ee 12px 20px,#1c0c53 21px 26px);box-shadow:0 0 38px #f83eea98;mask-image:linear-gradient(#000 0 70%,transparent 92%)}.mountains{position:absolute;z-index:-1;top:318px;left:0;width:100%;height:140px;background:#1f1557;clip-path:polygon(0 80%,13% 35%,24% 63%,39% 29%,49% 72%,67% 20%,81% 59%,91% 31%,100% 73%,100% 100%,0 100%);filter:drop-shadow(0 0 10px #fd36ed)}.character{display:block;margin:24px auto 0;width:min(90%,305px);height:290px;filter:drop-shadow(0 10px 16px #000a)}.screen{margin:-7px 10px 0;padding:14px;background:#0a1237e8;border:3px solid #aa6bff;border-radius:16px;box-shadow:0 0 18px #c355fc76;text-align:center;position:relative}.screen h2{font-size:17px;margin:0 0 10px;letter-spacing:.6px}.meter{border:2px solid #8c8bfa;border-radius:9px;height:21px;padding:3px;display:flex;gap:3px}.meter span{flex:1;background:#26256e;border-radius:2px}.meter span.on{background:linear-gradient(#77fba2,#17cc62);box-shadow:0 0 7px #3aff98}.result{min-height:42px;margin:8px 0 3px;color:#bfeeff;font-size:13px;line-height:1.4}.button{display:block;width:100%;margin:25px 0 12px;padding:17px 8px;border:4px solid #ff83cc;border-radius:18px;background:linear-gradient(#fff06f 0%,#ffbb18 65%,#fa8c13 100%);box-shadow:0 6px 0 #8739a0,0 0 25px #f44ac77a;color:#352044;font-size:20px;font-weight:1000;letter-spacing:.4px;cursor:pointer}.button:disabled{filter:grayscale(.45);cursor:wait}.foot{text-align:center;color:#c8bcf9;font-size:11px;line-height:1.45;margin:19px 5px 0}.pulse{animation:pulse .8s infinite alternate}@keyframes pulse{to{opacity:.45}}@media(min-width:600px){.app{min-height:850px;border-radius:22px}}
</style>
</head>
<body>
<main class="app"><div class="stars"></div><div class="sun"></div><div class="mountains"></div>
<header><div class="brand">🦝 RACCOON VISION</div><div class="badge">НАВЧАЛЬНЕ  </div></header>
<div class="settings"><label>💱 <select id="pair" aria-label="Валютна пара"><option>EUR/USD OTC</option><option>EUR/AUD OTC</option><option>GBP/USD OTC</option></select></label><label>⏱ <select id="duration" aria-label="Проміжок"><option>5 СЕК</option><option>30 СЕК</option><option>1 ХВ</option><option>5 ХВ</option></select></label></div>
<svg class="character" viewBox="0 0 330 310" role="img" aria-label="Кіберпанковий єнот у фіолетовому худі та окулярах">
<defs><linearGradient id="hood" x1="0" x2="1" y2="1"><stop stop-color="#ca75ff"/><stop offset=".45" stop-color="#65309e"/><stop offset="1" stop-color="#23174f"/></linearGradient><linearGradient id="fur" x1="0" x2="0" y2="1"><stop stop-color="#a6acbe"/><stop offset="1" stop-color="#54586f"/></linearGradient></defs>
<!-- hoodie --> <path d="M65 287Q50 221 107 183L115 164Q92 128 107 95Q122 49 165 45Q224 42 246 95Q264 141 224 175L230 192Q281 207 287 288Z" fill="url(#hood)" stroke="#e88dff" stroke-width="6"/>
<!-- ears --> <path d="M102 106L92 52Q96 29 126 57L150 90M214 88L241 49Q264 32 265 72L255 116" fill="#777e98" stroke="#26283e" stroke-width="9" stroke-linejoin="round"/><path d="M109 78L107 59L132 82M237 82L253 60L252 94" fill="#e49dd8"/>
<!-- face --> <path d="M111 103Q117 72 170 70Q226 70 242 111L236 160Q213 192 166 194Q123 186 107 158Z" fill="url(#fur)" stroke="#20243c" stroke-width="7"/><path d="M114 122Q125 97 166 115Q207 96 237 120L227 157Q198 176 166 162Q132 173 116 151Z" fill="#25283d"/><path d="M128 150Q164 162 199 148Q224 147 222 173Q203 201 170 197Q135 196 121 172Z" fill="#d4d4da"/>
<!-- shades --> <path d="M107 113Q137 106 165 120Q192 104 235 112L226 146Q202 158 178 141L163 141Q143 159 117 144Z" fill="#211544" stroke="#bf6eff" stroke-width="5"/><path d="M118 120L145 116L127 139M188 118L218 117L199 141" stroke="#7ef5ff" stroke-width="5" opacity=".85"/><path d="M150 161L170 150L190 161L175 174L165 174Z" fill="#212437"/><path d="M145 178Q167 194 190 178" fill="none" stroke="#303146" stroke-width="6" stroke-linecap="round"/>
<!-- hoodie body and folded arms --> <path d="M108 195Q77 207 69 266L95 291L233 291L269 261Q248 208 224 195Q209 218 167 223Q128 217 108 195Z" fill="url(#hood)" stroke="#c472ff" stroke-width="7"/><path d="M83 248Q112 211 154 249L191 267L238 235Q270 230 274 261Q266 280 226 289L160 287L129 275Q104 292 83 281Z" fill="#6535ae" stroke="#e08fff" stroke-width="7"/><path d="M101 242L144 266L187 278M247 241L224 266" fill="none" stroke="#271654" stroke-width="10" stroke-linecap="round"/><path d="M113 199Q163 238 217 199" stroke="#e0a6ff" fill="none" stroke-width="4"/><path d="M166 224L165 251M178 226L183 250" stroke="#f3c9ff" stroke-width="4" stroke-linecap="round"/>
</svg>
<section class="screen" aria-live="polite"><h2 id="status">ГОТОВИЙ ДО  СКАНУВАННЯ</h2><div class="meter" id="meter"></div><div class="result" id="result">Натисни кнопку, щоб побачити навчальний сценарій.</div></section>
<button class="button" id="scan">🎯 ШУКАТИ  СИГНАЛ</button>
<p class="foot">⚠️ Сигнали випадкові та вигадані. Це візуальна симуляція, не аналіз котирувань і не порада щодо торгівлі чи ставок.</p>
</main>
<script>
const meter=document.querySelector('#meter'),button=document.querySelector('#scan'),status=document.querySelector('#status'),result=document.querySelector('#result');
for(let i=0;i<15;i++)meter.append(document.createElement('span'));
button.addEventListener('click',()=>{button.disabled=true;result.textContent='Анімація імітує сканування. Жодних ринкових даних не отримуємо.';status.textContent='СКАНУВАННЯ (СИМУЛЯЦІЯ)...';status.classList.add('pulse');let n=0;const items=[...meter.children];items.forEach(x=>x.classList.remove('on'));let timer=setInterval(()=>{if(n<items.length){items[n++].classList.add('on')}else{clearInterval(timer);status.classList.remove('pulse');const up=Math.random()<.5;status.textContent=' СЦЕНАРІЙ ЗГЕНЕРОВАНО';result.innerHTML=`${document.querySelector('#pair').value} · ${document.querySelector('#duration').value}<br><strong style="color:${up?'#5aff9b':'#ff8098'}">${up?'↗ УМОВНИЙ РУХ УГОРУ':'↘ УМОВНИЙ РУХ УНИЗ'}</strong><br>Випадковий навчальний приклад — не прогноз.`;button.disabled=false}},110)});
</script>
</body></html>
